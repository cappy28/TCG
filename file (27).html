<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef4fa">
<meta name="referrer" content="no-referrer">
<title>ClassChat Nexus — Collectionne votre univers.</title>

<style>
/* =========================================================
   NEXUS · SYSTÈME VISUEL
   ========================================================= */

:root {
  color-scheme: light;
  --bg: #eef4fa;
  --ink: #172638;
  --muted: #586a7c;
  --blue: #075ddd;
  --blue-soft: #e9f1ff;
  --line: rgba(31, 57, 88, .13);
  --glass: rgba(255, 255, 255, .65);
  --surface: rgba(255, 255, 255, .87);
  --radius: 28px;
  --shadow: 0 18px 50px rgba(35, 62, 91, .08);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-width: 320px;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(ellipse at 5% 12%, #cdeaff, transparent 43%),
    radial-gradient(ellipse at 95% 36%, #d8f1e5, transparent 44%),
    radial-gradient(ellipse at 58% 100%, #f7e5dc, transparent 45%),
    linear-gradient(140deg, #f4f8fc, #e8eff6);
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: not-allowed; opacity: .45; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
a { color: var(--blue); }
svg { flex-shrink: 0; vertical-align: middle; }
h1, h2, h3, p { margin-top: 0; }
h1, h2, h3 { letter-spacing: -.045em; }
h2 { font-size: 28px; }
h3 { font-size: 20px; }
[hidden] { display: none !important; }

.glass {
  background: var(--glass);
  border: 1px solid rgba(255, 255, 255, .92);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .95),
    0 10px 35px rgba(38, 63, 93, .07);
  -webkit-backdrop-filter: blur(26px) saturate(155%);
  backdrop-filter: blur(26px) saturate(155%);
}

body.solid .glass,
body.solid dialog {
  background: #f9fbfe;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}

@supports not (backdrop-filter: blur(1px)) {
  .glass { background: #f8fbfe; }
}

.shell {
  max-width: 1240px;
  margin: auto;
  padding: 0 34px;
}

.topbar {
  min-height: 100px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  color: var(--blue);
  border-radius: 15px;
}

.brand-name {
  display: block;
  font-size: 17px;
  font-weight: 850;
  letter-spacing: .17em;
}

.brand-sub {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .03em;
}

.top-actions,
.row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.spacer { margin-top: 26px; }
.muted { color: var(--muted); }
.full { width: 100%; }

.wallet {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 750;
}

.wallet svg { color: #9c690d; }

.icon-btn {
  width: 44px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  color: var(--ink);
}

.avatar {
  border: 3px solid #ffffffdc;
  background: var(--ink);
  color: white;
  font-size: 12px;
  font-weight: 800;
}

main {
  min-height: 70vh;
  padding: 20px 0 26px;
}

.page { animation: appear .3s ease both; }

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .11em;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #319b77;
}

.page-title {
  margin: 15px 0 13px;
  font-size: clamp(36px, 5vw, 56px);
  line-height: 1.05;
}

.lead {
  max-width: 540px;
  color: var(--muted);
  font-size: 16px;
  line-height: 1.75;
}

.help {
  margin: 9px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 48px;
  padding: 12px 20px;
  border: 1px solid transparent;
  border-radius: 50px;
  font-size: 13px;
  font-weight: 750;
  transition: transform .2s, box-shadow .2s;
}

.btn:hover:not(:disabled) { transform: translateY(-2px); }
.btn:active:not(:disabled) { transform: scale(.98); }

.primary {
  color: white;
  background: var(--blue);
  box-shadow: 0 7px 18px #075ddd26, inset 0 1px 0 #ffffff40;
}

.secondary {
  color: var(--ink);
  background: #ffffffb3;
  border-color: var(--line);
}

.selected {
  color: var(--blue);
  background: var(--blue-soft);
  border-color: #b6cff6;
}

.text-btn {
  min-height: 44px;
  padding: 8px;
  border: 0;
  background: transparent;
  color: var(--blue);
  font-size: 13px;
  font-weight: 750;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 11px;
  border-radius: 50px;
  border: 1px solid white;
  background: #ffffffb8;
  font-size: 11px;
  font-weight: 750;
}

.notice {
  padding: 16px 18px;
  border: 1px solid #ffffffdc;
  border-radius: 20px;
  background: #ffffff94;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.panel {
  padding: 27px;
  border: 1px solid #ffffffed;
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}

.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: start;
  gap: 26px;
}

.empty {
  padding: 45px 23px;
  border: 1px solid #ffffffdc;
  border-radius: var(--radius);
  background: #ffffff9e;
  color: var(--muted);
  text-align: center;
  font-size: 14px;
  line-height: 1.8;
}

/* =========================================================
   ACCUEIL ET BOOSTER
   ========================================================= */

.hero {
  min-height: 475px;
  display: grid;
  grid-template-columns: 1.1fr .9fr;
  align-items: center;
  gap: 20px;
}

.hero h1 {
  margin: 22px 0;
  font-size: clamp(45px, 5.7vw, 76px);
  line-height: 1.01;
  font-weight: 800;
}

.hero h1 em { color: var(--blue); font-style: normal; }

.hero-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.pack-stage {
  position: relative;
  min-height: 435px;
  display: grid;
  place-items: center;
}

.orbit {
  position: absolute;
  width: 340px;
  height: 340px;
  border: 1px solid #ffffffdc;
  border-radius: 50%;
  background: radial-gradient(circle, #ffffffb3, #ffffff05 70%);
  box-shadow: 0 0 90px #c9e7ff80;
}

.orbit::after {
  content: "";
  position: absolute;
  inset: 25px;
  border: 1px solid #ffffffa6;
  border-radius: 50%;
}

.pack {
  position: relative;
  overflow: hidden;
  width: 230px;
  height: 330px;
  padding: 24px;
  border: 1px solid #ffffffed;
  border-radius: 16px;
  background:
    linear-gradient(130deg, #ffffffbc, transparent 40%, #ffffff82),
    linear-gradient(150deg, #e0f5fc, #a6dce6 39%, #d4e4fc 67%, #f6dfe7);
  color: #17364d;
  text-align: left;
  box-shadow: 15px 30px 50px #375b8130, inset 0 0 0 5px #ffffff45;
  transform: rotate(8deg);
  transition: transform .4s;
}

.pack:hover:not(:disabled) { transform: rotate(0) translateY(-8px); }

.pack::before,
.pack::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  height: 13px;
  background: repeating-linear-gradient(
    90deg, #ffffff65 0 2px, #6c9ca525 2px 4px
  );
}

.pack::before { top: 0; }
.pack::after { bottom: 0; }

.pack-brand {
  position: absolute;
  top: 30px;
  left: 24px;
  z-index: 1;
  font-size: 13px;
  font-weight: 850;
  letter-spacing: .22em;
}

.pack-label {
  position: absolute;
  bottom: 29px;
  left: 24px;
  font-size: 10px;
  font-weight: 800;
  line-height: 1.9;
  letter-spacing: .13em;
}

.pack-orb {
  position: absolute;
  top: 84px;
  left: 35px;
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 28% 20%, white, #ffffff00 43%),
    conic-gradient(
      from 30deg, #e9fffc, #5badd4, #cab1f0,
      #f7ddcb, #b3e5db, #e9fffc
    );
  box-shadow: inset -15px -15px 30px #34558b48, 0 20px 24px #46688020;
}

.pack-orb::after {
  content: "";
  position: absolute;
  inset: 31px -20px;
  border: 2px solid #ffffffab;
  border-radius: 50%;
  transform: rotate(-27deg);
}

.float-label {
  position: absolute;
  z-index: 2;
  padding: 11px 15px;
  border-radius: 50px;
  font-size: 11px;
  font-weight: 750;
}

.float-one { top: 55px; left: 0; transform: rotate(-5deg); }
.float-two { bottom: 38px; right: 0; transform: rotate(5deg); }

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 16px;
  margin: 35px 0 21px;
}

.section-head h2 { margin-bottom: 7px; font-size: 25px; }
.section-head p { margin: 0; font-size: 13px; }

/* =========================================================
   CARTES
   ========================================================= */

.card-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 18px;
}

.card-button {
  display: block;
  position: relative;
  width: 100%;
  padding: 0;
  border: 0;
  border-radius: 20px;
  background: none;
  color: inherit;
  text-align: left;
}

.tcg {
  display: flex;
  flex-direction: column;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: 100%;
  aspect-ratio: .7;
  padding: 8px;
  border: 1px solid #ffffffed;
  border-radius: 20px;
  background: linear-gradient(135deg, #ffffff, #d3dfeb 50%, #faffff);
  box-shadow: 0 10px 24px #29486714;
  transition: transform .25s, box-shadow .25s;
}

.card-button:hover .tcg {
  transform: translateY(-6px);
  box-shadow: 0 17px 30px #29486724;
}

.tcg.rare {
  background: linear-gradient(125deg, #fbffff, #b4e4f2, #c9bbf5, #ecfbff);
}

.tcg.mythique {
  background: conic-gradient(
    from 40deg, #fff1cc, #f5c9c6, #ddd3fa, #c8eff1, #fff1cc
  );
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 5px 5px 9px;
  color: #314251;
  font-size: 8px;
  font-weight: 850;
  letter-spacing: .12em;
}

.art {
  position: relative;
  display: block;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  border-radius: 12px;
  background: #e7eef6;
}

.art svg,
.art img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.art img.remote { object-fit: contain; background: #f2f5f9; }

.art::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    125deg, #ffffff24, transparent 36%, transparent 60%, #ffffff2e
  );
}

.remote-note {
  position: absolute;
  inset: auto 7px 7px;
  padding: 7px;
  border-radius: 10px;
  background: #ffffffed;
  color: #455970;
  font-size: 9px;
  line-height: 1.5;
  text-align: center;
}

.art.broken::before {
  content: "Image indisponible";
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 12px;
  background: #edf2f8;
  color: var(--muted);
  font-size: 11px;
  text-align: center;
}

.card-bottom {
  display: grid;
  gap: 7px;
  padding: 11px 6px 7px;
}

.card-name {
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  font-size: 13px;
  font-weight: 800;
  line-height: 1.25;
  letter-spacing: -.035em;
  overflow-wrap: anywhere;
}

.card-author { font-size: 9px; color: #4c5d6e; }

.rarity-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 3px;
}

.rarity {
  color: #3b4e62;
  font-size: 8px;
  font-weight: 850;
  text-transform: uppercase;
  letter-spacing: .08em;
}

.rarity-symbol { color: #52667b; font-size: 10px; letter-spacing: 1px; }

.count {
  position: absolute;
  z-index: 3;
  top: -7px;
  right: -5px;
  min-width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border: 2px solid var(--bg);
  border-radius: 20px;
  background: var(--ink);
  color: white;
  font-size: 10px;
  font-weight: 750;
}

.wish-mark {
  position: absolute;
  z-index: 3;
  top: 10px;
  left: 10px;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border: 1px solid white;
  border-radius: 50%;
  background: #fffffff0;
  color: #ad285b;
  box-shadow: 0 3px 10px #17223014;
}

.wish-mark svg { width: 14px; height: 14px; }

/* =========================================================
   FORMULAIRES, COLLECTION, BOUTIQUE
   ========================================================= */

label {
  display: block;
  margin-bottom: 8px;
  font-size: 13px;
  font-weight: 750;
}

input, select, textarea {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: #f5f8fc;
  color: var(--ink);
}

textarea { min-height: 86px; resize: vertical; }
input[type="file"] { font-size: 12px; }
input[type="checkbox"] {
  width: 18px;
  height: 18px;
  min-height: 0;
  accent-color: var(--blue);
}

.field { margin-bottom: 19px; }

.check {
  display: flex;
  align-items: start;
  gap: 10px;
  font-size: 12px;
  font-weight: 500;
  line-height: 1.7;
}

.check input { flex-shrink: 0; margin-top: 3px; }

.preview-panel {
  position: sticky;
  top: 25px;
  padding: 35px;
  text-align: center;
}

.preview-card {
  max-width: 260px;
  margin: 25px auto;
  transform: rotate(4deg);
}

.preview-card .card-name { font-size: 18px; }

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 13px;
  margin: 25px 0;
}

.stat {
  min-width: 140px;
  padding: 17px 21px;
  border-radius: 22px;
}

.stat strong {
  display: block;
  margin-bottom: 5px;
  font-size: 25px;
  letter-spacing: -.04em;
}

.stat small { color: var(--muted); font-size: 11px; }

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 15px;
  margin: 25px 0 18px;
}

.filters { display: flex; flex-wrap: wrap; gap: 7px; }

.chip {
  min-height: 42px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 30px;
  background: #ffffff94;
  color: var(--ink);
  font-size: 12px;
  font-weight: 700;
}

.chip.active {
  border-color: var(--ink);
  background: var(--ink);
  color: white;
}

.search { width: 230px; }

.collection-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 13px 17px;
  margin-bottom: 24px;
  border-radius: 20px;
}

.collection-tools p { margin: 0; }

.shop-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 20px;
}

.shop-item {
  padding: 14px;
  border: 1px solid white;
  border-radius: 26px;
  background: #ffffff99;
}

.shop-item > .btn {
  margin-top: 15px;
  padding: 10px;
  min-height: 43px;
  font-size: 12px;
}

.trade-preview { max-width: 190px; margin: 20px auto; }

.ref-connect {
  padding: 18px;
  margin-bottom: 24px;
  border: 1px solid #dce8f4;
  border-radius: 22px;
  background:
    radial-gradient(circle at 100% 0%, #d8eaff, transparent 70%),
    #f0f6fc;
}

.ref-connect strong { display: block; margin-bottom: 7px; }
.ref-connect .help { margin-bottom: 14px; }

/* =========================================================
   PROFIL
   ========================================================= */

.profile-head {
  display: flex;
  align-items: center;
  gap: 17px;
  padding: 23px;
  margin-bottom: 20px;
  border: 1px solid white;
  border-radius: 25px;
  background:
    radial-gradient(circle at 95% 0%, #d5e9ff, transparent 55%),
    linear-gradient(135deg, white, #edf5fb);
}

.profile-avatar {
  flex-shrink: 0;
  width: 66px;
  height: 66px;
  display: grid;
  place-items: center;
  border-radius: 23px;
  background: linear-gradient(135deg, #243b59, #075ddd);
  color: white;
  font-size: 22px;
  font-weight: 800;
  box-shadow: inset 0 1px 0 #ffffff50, 0 10px 25px #075ddd20;
}

.profile-head h3 { margin: 0 0 7px; font-size: 25px; overflow-wrap: anywhere; }
.profile-head p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }

.profile-tabs {
  display: flex;
  gap: 5px;
  padding: 6px;
  margin-bottom: 25px;
  border-radius: 22px;
}

.profile-tab {
  flex: 1;
  min-height: 44px;
  padding: 10px;
  border: 0;
  border-radius: 17px;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 750;
}

.profile-tab[aria-pressed="true"] {
  background: white;
  color: var(--blue);
  box-shadow: 0 3px 12px #24416c0d;
}

.profile-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 26px;
}

.profile-stat {
  padding: 16px 9px;
  border: 1px solid white;
  border-radius: 20px;
  background: #ffffffa6;
  text-align: center;
}

.profile-stat strong { display: block; margin-bottom: 5px; font-size: 25px; }
.profile-stat span { color: var(--muted); font-size: 11px; }

.showcase {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 15px;
  margin: 18px 0;
}

.empty-slot {
  width: 100%;
  aspect-ratio: .7;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 12px;
  border: 1px dashed #9caec2;
  border-radius: 20px;
  background: #ffffff66;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
  text-align: center;
}

.showcase-item { min-width: 0; }
.showcase-item .text-btn { width: 100%; font-size: 11px; }

.profile-form {
  padding: 22px;
  margin-top: 25px;
  border: 1px solid white;
  border-radius: 23px;
  background: #ffffffa6;
}

.profile-form input { min-width: 0; }

.friend-line {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}

.friend-face {
  flex-shrink: 0;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-weight: 750;
}

.friend-line strong { font-size: 14px; }
.friend-line p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }

.wish-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.wish-item { min-width: 0; }
.wish-item > .btn { width: 100%; margin-top: 12px; padding: 9px; font-size: 11px; }
.wish-item > .text-btn { width: 100%; font-size: 11px; }

.gift-line {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
}

.gift-art { flex: 0 0 54px; width: 54px; height: 74px; border-radius: 12px; }
.gift-copy { flex: 1; min-width: 0; }
.gift-copy strong { font-size: 14px; overflow-wrap: anywhere; }

  flex-wrap: wrap;
  gap: 12px;
}

.ref-status {
  min-height: 25px;
  margin: 17px 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.ref-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 15px;
}

.ref-item {
  min-width: 0;

  border: 1px solid #dfe8f2;

.ref-thumb {
  display: block;

.ref-copy { padding: 14px; }

.ref-copy h3 {
  min-height: 38px;

  font-size: 14px;
  line-height: 1.4;

   NAVIGATION, DIALOGUES, RÉVÉLATION
   ========================================================= */

.dock-wrap {
  position: fixed;
  z-index: 20;
  right: 0;
  bottom: max(20px, env(safe-area-inset-bottom));
  left: 0;
  display: flex;
  justify-content: center;
  padding: 0 10px;
  pointer-events: none;

.dock {
  display: flex;
  gap: 4px;
  padding: 7px;
  border-radius: 30px;

}

.nav-item {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 13px 18px;

  border-radius: 24px;
  background: transparent;
  color: #495d70;
  font-size: 12px;
  font-weight: 750;

.nav-item[aria-current="page"] {
  background: #ffffffed;
  color: var(--blue);
  box-shadow: 0 2px 9px #243c6410, inset 0 0 0 1px white;
}

dialog {
  width: min(900px, calc(100% - 28px));
  max-height: 90dvh;
  overflow: auto;
  padding: 29px;
  border: 1px solid #ffffffed;
  border-radius: 30px;
  background: #f7fbfff5;
  color: var(--ink);
  box-shadow: 0 40px 140px #15294438;
}

dialog::backdrop {
  background: #172c454d;
  -webkit-backdrop-filter: blur(9px);
  backdrop-filter: blur(9px);
}

.dialog-head {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 23px;
}

.dialog-head h2 { margin: 3px 0 0; }

.close {
  flex-shrink: 0;
  width: 39px;
  height: 39px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: #e8eef5;
  color: var(--ink);
}

.detail-layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  align-items: center;
  gap: 33px;
}

.detail-layout > .tcg .card-name { font-size: 18px; }
.detail-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 23px; }

.reveal-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
  margin: 25px 0;
}

.flip {
  width: 100%;
  aspect-ratio: .7;
  padding: 0;
  border: 0;
  background: none;
  perspective: 1000px;
}

.flip-inner {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform .6s cubic-bezier(.2, .7, .2, 1);
}

.flip.revealed .flip-inner { transform: rotateY(180deg); }

.flip-back,
.flip-front {
  position: absolute;
  inset: 0;
  display: block;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

.flip-back {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  border: 4px solid #ecf4ff;
  border-radius: 20px;

  color: #ffffffe0;
  box-shadow: 0 8px 18px #172c451a;
}

.flip-back strong { font-size: 10px; letter-spacing: .14em; }
.flip-back svg { width: 34px; height: 34px; }

.flip-front { transform: rotateY(180deg); visibility: hidden; }
.flip.revealed .flip-front { visibility: visible; }
.flip.revealed .flip-back { visibility: hidden; }

.reveal-grid .card-top { font-size: 7px; }
.reveal-grid .card-name { font-size: 11px; }
.reveal-grid .card-author { font-size: 8px; }

.credits {

  font-size: 11px;
  line-height: 1.8;
}

.footer {
  padding: 10px 0 145px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.8;
}

.footer a { display: inline-block; padding: 3px; }
#storageStatus { color: #98490a; }

.toast {
  position: fixed;
  z-index: 100;
  top: 18px;
  left: 50%;
  width: max-content;
  max-width: calc(100% - 30px);
  padding: 14px 19px;
  border-radius: 20px;
  background: #182b40f5;
  color: white;
  font-size: 13px;

  pointer-events: none;
  box-shadow: 0 10px 40px #182b4030;
}

.toast.visible { opacity: 1; transform: translate(-50%, 0); }

@keyframes appear {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

<script>
"use strict";

/* =========================================================
   OUTILS ET CONSTANTES
   ========================================================= */

const $ = selector => document.querySelector(selector);

const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[char]));

const paths = {
  nexus: '<path d="m12 3 8 5v8l-8 5-8-5V8z"/><path d="m4 8 8 5 8-5M12 13v8"/>',
  coin: '<circle cx="12" cy="12" r="9"/><path d="m12 7 3 5-3 5-3-5z"/>',
  booster: '<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 3v3m8-3v3M8 18v3m8-3v3m-4-12 2 3-2 3-2-3z"/>',
  collection: '<rect x="8" y="3" width="12" height="16" rx="2"/><path d="M4 7v12a2 2 0 0 0 2 2h10M12 8h4m-4 4h4"/>',
  create: '<path d="M12 5v14M5 12h14"/><circle cx="12" cy="12" r="9"/>',
  trade: '<path d="M4 7h15m-4-4 4 4-4 4M20 17H5m4-4-4 4 4 4"/>',
  shop: '<path d="M5 8h14l1 13H4zM8 8V6a4 4 0 0 1 8 0v2"/>',
  arrow: '<path d="M5 12h14m-5-5 5 5-5 5"/>',
  close: '<path d="m6 6 12 12M6 18 18 6"/>',
  spark: '<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>',
  contrast: '<circle cx="12" cy="12" r="9"/><path d="M12 3v18M12 3a9 9 0 0 1 0 18" fill="currentColor"/>',
  gift: '<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M3 7h18v4H3zm9 0v14"/><path d="M12 7H8a2.5 2.5 0 1 1 2.5-2.5L12 7zm0 0h4a2.5 2.5 0 1 0-2.5-2.5L12 7z"/>',
  search: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',
  heart: '<path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-8.8a5.4 5.4 0 0 0 0-7.6Z"/>'
};

function icon(name) {
  return `<svg width="20" height="20" viewBox="0 0 24 24"
    fill="none" stroke="currentColor" stroke-width="1.65"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    ${paths[name] || paths.spark}
  </svg>`;
}

const KEY = "classchat-nexus-demo-v1";
const TODAY = () => new Date().toISOString().slice(0, 10);
const CREATION_COST = 80;
const DAILY_CREATIONS = 3;

const friends = {
  leo:  { name: "Léo", initial: "L", color: "#e1ecff" },
  ines: { name: "Inès", initial: "I", color: "#f5e5ef" },
  noa:  { name: "Noa", initial: "N", color: "#def1e9" }
};

const rules = {
  commune:  { label: "Commune", symbol: "◆", reward: 5, price: 30 },
  rare:     { label: "Rare", symbol: "✦ ✦", reward: 15, price: 90 },
  mythique: { label: "Mythique", symbol: "✧ ✧ ✧", reward: 45, price: 270 }
};

const palettes = {
  sky:   ["#c7effa", "#659fd6", "#f0e7ff", "#e0f8ff"],
  mint:  ["#c7eee0", "#477f7a", "#fff3cf", "#e0f5db"],
  candy: ["#f7dbe5", "#b572a4", "#fff1c9", "#e4d7ff"],
  night: ["#172b50", "#526ab3", "#e7d8ff", "#8bcacb"],
  solar: ["#f3d5af", "#c36d56", "#fff3c9", "#dca7cd"]
};

const baseCards = [
  {
    id: "a", name: "L'heure bleue", rarity: "commune",
    theme: "sky", creator: "Noa",
    desc: "Quand le ciel hésite entre le jour et la nuit."
  },
  {
    id: "b", name: "Petit chaos", rarity: "commune",
    theme: "candy", creator: "Inès",
    desc: "Rien ne se passe comme prévu. C'est ça qui est bien."
  },
  {
    id: "c", name: "Après les cours", rarity: "commune",
    theme: "mint", creator: "Léo",
    desc: "Le meilleur moment de la journée commence ici."
  },
  {
    id: "d", name: "Dernier métro", rarity: "commune",
    theme: "night", creator: "Noa",
    desc: "Encore une station, encore une histoire."
  },
  {
    id: "e", name: "Club lunaire", rarity: "rare",
    theme: "night", creator: "Inès",
    desc: "Une réunion privée, quelque part au-dessus des nuages."
  },
  {
    id: "f", name: "Mode avion", rarity: "rare",
    theme: "sky", creator: "Léo",
    desc: "Déconnecté du bruit. Connecté au reste."
  },
  {
    id: "g", name: "Hors orbite", rarity: "rare",
    theme: "solar", creator: "Noa",
    desc: "Personne n'a dit qu'il fallait rester sur la même planète."
  },
  {
    id: "h", name: "Éclipse", rarity: "mythique",
    theme: "night", creator: "Léo",
    desc: "Quelques secondes pour un souvenir qui reste."
  },
  {
    id: "i", name: "Supernova", rarity: "mythique",
    theme: "solar", creator: "Inès",
    desc: "Un petit point de lumière. Une très grande histoire."
  }
];

function safeRemoteImage(value) {
  try {
    const url = new URL(String(value));
    const allowedHosts = new Set([
      "i.imgflip.com",
      "justmeme.wtf",
      "www.justmeme.wtf"
    ]);

    if (
      url.protocol !== "https:" ||
      url.username ||
      url.password ||
      url.port ||
      !allowedHosts.has(url.hostname) ||
      !/\.(jpe?g|png|webp|gif)$/i.test(url.pathname)
    ) return "";

    url.hash = "";
    return url.href;
  } catch (_) {
    return "";
  }
}

function safeLocalImage(value) {
  return typeof value === "string" &&
    value.length < 700000 &&
    /^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(value)
      ? value
      : "";
}

function cleanImage(value) {
  return safeLocalImage(value) || safeRemoteImage(value);
}

function sourceURL(reference) {
  if (!reference) return "https://imgflip.com";

  const id = String(reference.id || "");

  if (reference.provider === "Imgflip" && /^\d+$/.test(id)) {
    return "https://imgflip.com/memegenerator/" + id;
  }

  if (reference.provider === "justmeme") {
    return "https://justmeme.wtf/meme/" + encodeURIComponent(id);
  }

  return "https://imgflip.com";
}

function creditsHTML() {
  return `<div class="credits">
    Sources :
    <a href="https://justmeme.wtf"
      target="_blank" rel="noopener noreferrer">justmeme</a>
    et
    <a href="https://imgflip.com"
      target="_blank" rel="noopener noreferrer">Imgflip</a>.
    L'accès aux modèles ne transmet pas automatiquement les droits sur les images.
  </div>`;
}

/* =========================================================
   ÉTAT LOCAL ET COMPATIBILITÉ AVEC LES VERSIONS PRÉCÉDENTES
   ========================================================= */

function freshState() {
  return {
    v: 1,
    tokens: 160,
    bag: { a: 3, b: 2, e: 1 },
    known: ["a", "b", "e"],
    day: TODAY(),
    boosters: 2,
    custom: [],
    gifts: [],
    solid: false,
    stock: {
      leo:  { c: 3, d: 3, f: 2, g: 2, h: 2 },
      ines: { c: 3, d: 2, f: 2, g: 2, i: 2 },
      noa:  { c: 2, d: 3, f: 2, g: 2, h: 2 }
    },
    nexusV2: {
      name: "Moi",
      wishlist: [],
      showcase: []
    }
  };
}

function integer(value, fallback, maximum = 1000000) {
  const number = Number(value);
  return Number.isFinite(number)
    ? Math.max(0, Math.min(maximum, Math.floor(number)))
    : fallback;
}

let loadWarning = "";

function loadState() {
  const fresh = freshState();

  try {
    const text = localStorage.getItem(KEY);
    if (!text) return fresh;

    const raw = JSON.parse(text);
    if (raw?.v !== 1) return fresh;

    const ids = new Set(baseCards.map(card => card.id));
    const custom = [];

    for (const card of Array.isArray(raw.custom) ? raw.custom : []) {
      if (!card || typeof card.id !== "string" ||
          !/^u-[a-zA-Z0-9-]{1,100}$/.test(card.id) ||
          ids.has(card.id)) continue;

      ids.add(card.id);

      custom.push({
        id: card.id,
        name: String(card.name || "Sans titre").slice(0, 30),
        desc: String(card.desc || "").slice(0, 140),
        creator: "Toi",
        rarity: Object.hasOwn(rules, card.rarity)
          ? card.rarity : "commune",
        theme: Object.hasOwn(palettes, card.theme)
          ? card.theme : "sky",
        image: cleanImage(card.image),
        date: String(card.date || TODAY()).slice(0, 10),
        reference: card.reference &&
          ["justmeme", "Imgflip"].includes(card.reference.provider)
            ? {
                id: String(card.reference.id || "").slice(0, 150),
                name: String(card.reference.name || "").slice(0, 100),
                provider: card.reference.provider
              }
            : null
      });
    }

    function cleanBag(input) {
      const output = {};
      if (!input || typeof input !== "object") return output;

      for (const [id, amount] of Object.entries(input)) {
        if (!ids.has(id)) continue;
        const count = integer(amount, 0);
        if (count > 0) output[id] = count;
      }

      return output;
    }

    const bag = cleanBag(raw.bag);
    const profile = raw.nexusV2 || {};
    const stock = {};

    for (const id of Object.keys(friends)) {
      stock[id] = raw.stock?.[id]
        ? cleanBag(raw.stock[id])
        : fresh.stock[id];
    }

    return {
      v: 1,
      tokens: integer(raw.tokens, 160, 1000000000),
      bag,
      known: [...new Set([
        ...(Array.isArray(raw.known) ? raw.known : []),
        ...Object.keys(bag)
      ])].filter(id => ids.has(id)),
      day: /^\d{4}-\d{2}-\d{2}$/.test(String(raw.day))
        ? raw.day : TODAY(),
      boosters: integer(raw.boosters, 2, 2),
      custom,
      gifts: (Array.isArray(raw.gifts) ? raw.gifts : [])
        .filter(gift =>
          gift && ids.has(gift.id) &&
          Object.hasOwn(friends, gift.friend)
        )
        .map(gift => ({
          id: gift.id,
          friend: gift.friend,
          date: String(gift.date || TODAY()).slice(0, 10)
        })),
      solid: Boolean(raw.solid),
      stock,
      nexusV2: {
        name: String(profile.name || "Moi").trim().slice(0, 24) || "Moi",
        wishlist: Array.isArray(profile.wishlist)
          ? profile.wishlist.filter(id => ids.has(id)) : [],
        showcase: Array.isArray(profile.showcase)
          ? profile.showcase.filter(id => ids.has(id)).slice(0, 3) : []
      }
    };

  } catch (_) {
    loadWarning =
      "La sauvegarde précédente n'a pas pu être lue. Une session neuve a été ouverte.";
    return fresh;
  }
}

function toast(message) {
  $("#toast").textContent = message;
  $("#toast").classList.add("visible");
  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    $("#toast").classList.remove("visible");
  }, 4400);
}

function storageMessage() {
  $("#storageStatus").textContent = storageAvailable
    ? ""
    : "Sauvegarde indisponible : les changements de cette session pourraient être perdus.";
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    storageAvailable = true;
  } catch (_) {
    storageAvailable = false;
  }

  storageMessage();
}

function refreshDaily() {
  if (state.day === TODAY()) return;
  state.day = TODAY();
  state.boosters = 2;
  save();
}

function synchronizeProfile() {
  const profile = state.nexusV2;
  const before = JSON.stringify(profile);

  profile.wishlist = [...new Set(profile.wishlist)]
    .filter(id => findCard(id) && quantity(id) === 0);

  profile.showcase = [...new Set(profile.showcase)]
    .filter(id => findCard(id) && quantity(id) > 0)
    .slice(0, 3);

  if (JSON.stringify(profile) !== before) save();
}

function initials(name) {
  return name.trim().split(/\s+/).slice(0, 2)

}

function formattedDate(value) {
  const parts = String(value || "").split("-");
  return parts.length === 3
    ? `${parts[2]}/${parts[1]}/${parts[0]}`
    : "Date inconnue";
}

function artwork(card) {
  const local = safeLocalImage(card.image);

  if (local) {
    return `<img src="${esc(local)}" alt="" loading="lazy">`;
  }

  const remote = safeRemoteImage(card.image);

  if (remote && refs.enabled) {
    return `<img class="remote"
      src="${esc(remote)}"
      alt=""
      loading="lazy"
      referrerpolicy="no-referrer">`;
  }

  return originalArtwork(card) + (
    remote
      ? `<span class="remote-note">
          Image externe masquée.<br>Active la bibliothèque pour l'afficher.
        </span>`
      : ""
  );
}

function randomCard() {
  const roll = Math.random();
  const rarity = roll < .70
    ? "commune"
    : roll < .95 ? "rare" : "mythique";

  const pool = allCards().filter(card => card.rarity === rarity);
  return pool[Math.floor(Math.random() * pool.length)];
}

function addCard(id, discoveryReward = false) {
  const card = findCard(id);
  const isNew = !state.known.includes(id);

  state.bag[id] = quantity(id) + 1;

  if (isNew) state.known.push(id);

  const reward = isNew && discoveryReward
    ? rules[card.rarity].reward : 0;

  state.tokens += reward;

  return { isNew, reward };
}

function revealButton(button) {

}

function openBooster() {
  refreshDaily();

  if (state.boosters < 1) {
    return toast("Tous les boosters du jour ont été ouverts.");

  state.boosters--;
  const results = [];
  let earned = 0;

  for (let index = 0; index < 5; index++) {
    const card = randomCard();
    const added = addCard(card.id, true);
    earned += added.reward;
    results.push({ card, ...added });
  }

  save();
  render();

  showDialog("Cinq cartes. À toi de découvrir.", `
    <p class="muted">

      ${results.map(({ card }, index) => `

function buyCard(id) {
  const card = findCard(id);
  if (!card) return;

  const price = rules[card.rarity].price;

  if (state.tokens < price) {
    return toast("Pas assez de jetons.");
  }

  state.tokens -= price;
  addCard(id, false);
  save();
  render();

  toast(`${card.name} rejoint ta collection. −${price} jetons.`);
}

/* =========================================================

async function readPersonalImage(file) {
  if (!file) return;

  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    return toast("Choisis une image JPG, PNG ou WebP.");
  }

  if (file.size > 2 * 1024 * 1024) {
    return toast("L'image doit faire moins de 2 Mo.");
  }

  const version = ++imageReadVersion;
  ui.imageBusy = true;
  updateDraftPreview();

  try {
    const data = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    const image = await new Promise((resolve, reject) => {
      const element = new Image();
      element.onload = () => resolve(element);
      element.onerror = reject;
      element.src = data;
    });

    if (version !== imageReadVersion) return;

    const scale = Math.min(1, 600 / Math.max(image.width, image.height));
    const canvas = document.createElement("canvas");

    canvas.width = Math.max(1, Math.round(image.width * scale));
    canvas.height = Math.max(1, Math.round(image.height * scale));

    const context = canvas.getContext("2d");
    if (!context) throw new Error("Canvas indisponible");

    context.fillStyle = "#eef3f8";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);

    const prepared = canvas.toDataURL("image/jpeg", .80);

    if (!safeLocalImage(prepared)) {
      throw new Error("Image préparée trop volumineuse");
    }

    ui.draft.image = prepared;
    ui.draft.reference = null;
    ui.draft.consent = false;

    const consent = $("#createForm [name='consent']");
    if (consent) consent.checked = false;

    toast("Image préparée localement. Aucun envoi effectué.");

  } catch (_) {
    if (version === imageReadVersion) {
      toast("Impossible de préparer cette image. Essaie un autre fichier.");
    }

  } finally {
    if (version === imageReadVersion) {
      ui.imageBusy = false;
      updateDraftPreview();
    }
  }
}

/* =========================================================
   ÉCHANGES
   ========================================================= */

function findMatchingTrade(card) {
  if (card.creator === "Toi") return null;

  const give = ownedCards().find(candidate =>
    quantity(candidate.id) > 1 &&
    candidate.rarity === card.rarity &&
    candidate.id !== card.id
  );

  if (!give) return null;

  const friend = Object.keys(friends).find(id =>
    (state.stock[id][card.id] || 0) > 1
  );

  return friend ? { friend, give: give.id } : null;
}

function tradeCards(form) {
  const data = new FormData(form);
  const friend = String(data.get("friend"));
  const give = findCard(String(data.get("give")));
  const want = findCard(String(data.get("want")));

  if (!Object.hasOwn(friends, friend) || !give || !want) {
    return toast("Échange incomplet.");
  }

  const stock = state.stock[friend];

  if (
    give.id === want.id ||
    give.rarity !== want.rarity ||
    quantity(give.id) < 2 ||
    (stock[want.id] || 0) < 2 ||
    want.creator === "Toi"
  ) {
    return toast("Cet échange n'est plus compatible.");
  }

  state.bag[give.id]--;
  addCard(want.id, false);

  stock[want.id]--;
  stock[give.id] = (stock[give.id] || 0) + 1;

  save();
  render();

  toast(
    `Échange simulé avec ${friends[friend].name} : tu reçois ${want.name}.`
  );
}

/* =========================================================
   BIBLIOTHÈQUE EXTERNE : API, CACHE ET REPLI
   ========================================================= */

const MEME_API = "https://justmeme.wtf/api/v1";
const IMGFLIP_API = "https://api.imgflip.com/get_memes";
const CACHE_TTL = 15 * 60 * 1000;
const PAGE_SIZE = 24;

function cancelReferenceRequests() {
  refs.sequence++;
  refs.busy = false;
  for (const controller of refs.pending) controller.abort();
  refs.pending.clear();
}

async function fetchJSON(url, force = false) {
  const cached = refs.cache.get(url);

  if (!force && cached && Date.now() - cached.time < CACHE_TTL) {
    return cached.data;
  }

  const controller = new AbortController();
  refs.pending.add(controller);

  const timeout = setTimeout(() => controller.abort(), 10000);

  try {
    const response = await fetch(url, {
      signal: controller.signal,
      credentials: "omit",
      referrerPolicy: "no-referrer",
      cache: force ? "no-store" : "default"
    });

    if (!response.ok) throw new Error("HTTP " + response.status);

    const data = await response.json();
    if (data.success === false) throw new Error("Source indisponible");

    refs.cache.set(url, { time: Date.now(), data });
    return data;

  } finally {
    clearTimeout(timeout);
    refs.pending.delete(controller);
  }
}

function normalizeReferences(items, provider) {
  const seen = new Set();

  return items.slice(0, 3000).flatMap(item => {
    const image = safeRemoteImage(item?.url);
    const id = String(item?.slug || item?.id || "").slice(0, 150);
    const name = String(item?.name || "").trim().slice(0, 100);

    if (!image || !id || !name || seen.has(image)) return [];
    seen.add(image);

    return [{ id, name, image, provider }];
  });
}

async function retrieveReferences(force, isCurrent) {
  if (force) refs.primaryUnavailableUntil = 0;

  try {
    if (Date.now() < refs.primaryUnavailableUntil) {
      throw new Error("Source principale en pause");
    }

    let endpoint;

    if (refs.query) {
      endpoint = "/templates/search?q=" + encodeURIComponent(refs.query);
    } else if (refs.mode === "trending") {
      endpoint = "/trending";
    } else {
      endpoint = `/templates?page=${refs.page}&limit=${PAGE_SIZE}`;
    }

    const data = await fetchJSON(MEME_API + endpoint, force);
    const raw = !refs.query && refs.mode === "trending"
      ? data.trending : data.templates;

    if (!Array.isArray(raw)) throw new Error("Format inattendu");

    const list = normalizeReferences(raw, "justmeme");

    if (raw.length && !list.length) {
      throw new Error("Images incompatibles");
    }

    if (refs.query) {
      const offset = (refs.page - 1) * PAGE_SIZE;

      return {
        items: list.slice(offset, offset + PAGE_SIZE),
        total: list.length,
        source: "justmeme · recherche",
        hasNext: offset + PAGE_SIZE < list.length
      };
    }

    if (refs.mode === "trending") {
      return {
        items: list,
        total: list.length,
        source: "justmeme · sélection tendances",
        hasNext: false
      };
    }

    const total = Number(data.total);

    return {
      items: list,
      total: Number.isFinite(total) ? total : list.length,
      source: "justmeme · catalogue",
      hasNext: Number.isFinite(total)
        ? refs.page * PAGE_SIZE < total
        : list.length === PAGE_SIZE
    };

  } catch (error) {
    if (!isCurrent()) throw error;

    refs.primaryUnavailableUntil = Date.now() + 60000;

    const data = await fetchJSON(IMGFLIP_API, force);
    if (!Array.isArray(data?.data?.memes)) {
      throw new Error("Source de secours indisponible");
    }

    let list = normalizeReferences(data.data.memes, "Imgflip");

    if (refs.query) {
      const needle = refs.query.toLocaleLowerCase("fr");
      list = list.filter(item =>
        item.name.toLocaleLowerCase("fr").includes(needle)
      );
    }

    const offset = (refs.page - 1) * PAGE_SIZE;

    return {
      items: list.slice(offset, offset + PAGE_SIZE),
      total: list.length,
      source: "Imgflip · secours · modèles populaires",
      hasNext: offset + PAGE_SIZE < list.length
    };
  }
}
