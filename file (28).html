<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#edf3f8">

  <meta
    name="description"
    content="Nexus : crée, collectionne et échange les cartes de ton univers."
  >

  <meta name="referrer" content="no-referrer">

  <title>Nexus — Votre univers en cartes</title>

  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>

<body>
  <a class="skip-link" href="#app">Aller au contenu</a>

  <div class="shell">
    <header class="topbar">
      <button
        class="brand"
        type="button"
        data-view="boosters"
        aria-label="Nexus, accueil"
      >
        <span class="brand-mark glass" id="brandIcon"></span>

        <span class="brand-copy">
          <span class="brand-name">NEXUS</span>
          <span class="brand-sub">ClassChat · collection sociale</span>
        </span>
      </button>

      <div class="top-actions">
        <span class="local-badge">Version locale</span>

        <div class="wallet glass" aria-label="Solde en jetons virtuels">
          <span id="coinIcon" aria-hidden="true"></span>
          <span id="balance">0</span>
        </div>

        <button
          class="icon-btn glass contrast-button"
          id="contrastButton"
          type="button"
          data-action="contrast"
          aria-label="Réduire la transparence"
          aria-pressed="false"
        ></button>

        <button
          class="avatar"
          id="profileButton"
          type="button"
          data-view="profile"
          aria-label="Ouvrir mon profil"
        >MOI</button>
      </div>
    </header>

    <p class="storage-warning" id="storageWarning" role="status" hidden></p>

    <main id="app" tabindex="-1"></main>

    <footer class="site-footer">
      <p>
        Nexus · expérience locale · aucun achat en argent réel.
        Les amis et les échanges sont simulés.
      </p>

      <p>
        Sources externes facultatives :
        <a
          href="https://justmeme.wtf"
          target="_blank"
          rel="noopener noreferrer"
        >justmeme</a>
        ·
        <a
          href="https://imgflip.com"
          target="_blank"
          rel="noopener noreferrer"
        >Imgflip</a>
      </p>
    </footer>
  </div>

  <div class="dock-wrap">
    <nav
      class="dock glass"
      id="navigation"
      aria-label="Navigation principale"
    ></nav>
  </div>

  <dialog id="modal" aria-labelledby="modalTitle"></dialog>

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>

  <noscript>
    <div class="noscript-message">
      Active JavaScript pour utiliser Nexus.
    </div>
  </noscript>
</body>
</html>
